version: '3.8'

services:

  mariadb:
    image: mariadb:11
    container_name: triage-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: triage_academico_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./TRIAGE_ACADEMICO
    container_name: triage-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/triage_academico_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build: ./triage-frontend
    container_name: triage-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mariadb_data: