openapi: 3.0.0

info:
  title: API Sistema de Triage Académico — Universidad del Quindío
  description: >
    API REST del sistema de gestión y priorización de solicitudes académicas.
    Permite registrar, clasificar, asignar y cerrar solicitudes estudiantiles
    con soporte opcional de inteligencia artificial.
    Proyecto: Programación Avanzada · Hito 1.
  version: 1.0.0
  contact:
    name: César Arturo Giraldo Vélez
    email: cagiraldov@uqvirtual.edu.co

# ─────────────────────────────────────────────────────────────
# SEGURIDAD GLOBAL — todos los endpoints requieren JWT
# excepto los marcados con security: []
# ─────────────────────────────────────────────────────────────
security:
  - BearerAuth: []

tags:
  - name: Autenticación
    description: Login y logout de usuarios
  - name: Solicitudes
    description: Ciclo de vida completo de solicitudes académicas
  - name: Historial
    description: Auditoría y trazabilidad de cambios por solicitud
  - name: Usuarios
    description: Gestión de usuarios del sistema (solo ADMIN)
  - name: Inteligencia Artificial
    description: Sugerencias y resúmenes opcionales generados por IA (RF-09, RF-10, RF-11)

# ─────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────
paths:

  # ═══════════════════════════════════════════
  # AUTENTICACIÓN
  # ═══════════════════════════════════════════
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: >
        Autentica al usuario con correo y contraseña.
        Devuelve un token JWT que debe incluirse en todas las peticiones
        posteriores como: Authorization: Bearer <token>.
        RF-13.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: >
        Invalida el token JWT del usuario autenticado.
        Requiere token válido en el header Authorization. RF-13.
      operationId: logout
      responses:
        '200':
          description: Sesión cerrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ═══════════════════════════════════════════
  # SOLICITUDES
  # ═══════════════════════════════════════════
  /api/solicitudes:
    post:
      tags: [Solicitudes]
      summary: Registrar nueva solicitud
      description: >
        Crea una solicitud académica en estado REGISTRADA.
        Roles permitidos: ESTUDIANTE, RESPONSABLE, ADMIN. RF-01.
      operationId: crearSolicitud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
      responses:
        '201':
          description: Solicitud registrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Solicitudes]
      summary: Listar solicitudes con filtros y paginación
      description: >
        Devuelve una página de solicitudes filtrable por estado, tipo,
        prioridad y responsable asignado.
        Roles permitidos: RESPONSABLE, ADMIN.
        ESTUDIANTE NO puede usar este endpoint — debe usar GET /api/solicitudes/{id}. RF-07.
      operationId: listarSolicitudes
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoSolicitud'
        - name: tipo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoSolicitud'
        - name: prioridad
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Prioridad'
        - name: responsableId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Número de página (inicia en 0)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Cantidad de registros por página
      responses:
        '200':
          description: Página de solicitudes obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSolicitudDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/solicitudes/{id}:
    get:
      tags: [Solicitudes]
      summary: Obtener solicitud por ID
      description: >
        Devuelve el detalle de una solicitud específica.
        ESTUDIANTE solo puede consultar sus propias solicitudes.
        RESPONSABLE y ADMIN pueden consultar cualquiera. RF-07.
      operationId: obtenerSolicitud
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Solicitud encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/solicitudes/{id}/clasificar:
    patch:
      tags: [Solicitudes]
      summary: Clasificar solicitud — asignar tipo y prioridad
      description: >
        Transiciona la solicitud de REGISTRADA a CLASIFICADA.
        Requiere tipo, prioridad y justificación.
        Roles permitidos: RESPONSABLE, ADMIN. RF-02, RF-03.
      operationId: clasificarSolicitud
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasificarRequest'
      responses:
        '200':
          description: Solicitud clasificada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/solicitudes/{id}/asignar:
    patch:
      tags: [Solicitudes]
      summary: Asignar responsable a solicitud
      description: >
        Transiciona la solicitud de CLASIFICADA a EN_ATENCION
        asignando un responsable activo.
        Roles permitidos: ADMIN. RF-05.
      operationId: asignarResponsable
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarRequest'
      responses:
        '200':
          description: Responsable asignado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/solicitudes/{id}/estado:
    patch:
      tags: [Solicitudes]
      summary: Cambiar estado de solicitud
      description: >
        Ejecuta una transición de estado explícita sobre la solicitud.
        La transición debe ser válida según la máquina de estados.
        Roles permitidos: RESPONSABLE, ADMIN. RF-04.
      operationId: cambiarEstado
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
      responses:
        '200':
          description: Estado actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/solicitudes/{id}/cerrar:
    patch:
      tags: [Solicitudes]
      summary: Cerrar solicitud
      description: >
        Transiciona la solicitud de ATENDIDA a CERRADA.
        Requiere obligatoriamente una observación de cierre.
        Estado CERRADA es inmutable — no admite más cambios.
        Roles permitidos: RESPONSABLE, ADMIN. RF-08.
      operationId: cerrarSolicitud
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CerrarRequest'
      responses:
        '200':
          description: Solicitud cerrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ═══════════════════════════════════════════
  # HISTORIAL
  # ═══════════════════════════════════════════
  /api/solicitudes/{id}/historial:
    get:
      tags: [Historial]
      summary: Obtener historial de una solicitud
      description: >
        Devuelve la lista completa de acciones ejecutadas sobre
        una solicitud ordenadas cronológicamente.
        Roles permitidos: RESPONSABLE, ADMIN. RF-06.
      operationId: obtenerHistorial
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Historial obtenido exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistorialDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ═══════════════════════════════════════════
  # USUARIOS
  # ═══════════════════════════════════════════
  /api/usuarios:
    post:
      tags: [Usuarios]
      summary: Crear nuevo usuario
      description: >
        Registra un nuevo usuario en el sistema.
        Roles permitidos: ADMIN. RF-13.
      operationId: crearUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El correo o la identificación ya están registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/usuarios/responsables:
    get:
      tags: [Usuarios]
      summary: Listar responsables activos
      description: >
        Devuelve la lista de usuarios con rol RESPONSABLE
        disponibles para ser asignados a solicitudes.
        Roles permitidos: ADMIN. RF-05.
      operationId: listarResponsables
      parameters:
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Filtrar por estado activo/inactivo
      responses:
        '200':
          description: Lista de responsables obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/usuarios/{id}/estado:
    patch:
      tags: [Usuarios]
      summary: Activar o desactivar usuario
      description: >
        Cambia el estado activo/inactivo de un usuario.
        Un usuario inactivo no puede ser asignado a solicitudes.
        Roles permitidos: ADMIN. RF-13.
      operationId: cambiarEstadoUsuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID del usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoUsuarioRequest'
      responses:
        '200':
          description: Estado del usuario actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ═══════════════════════════════════════════
  # INTELIGENCIA ARTIFICIAL (OPCIONAL)
  # ═══════════════════════════════════════════
  /api/ia/sugerir:
    post:
      tags: [Inteligencia Artificial]
      summary: Sugerir tipo y prioridad para una solicitud
      description: >
        Envía la descripción de una solicitud al modelo de IA y recibe
        una sugerencia de TipoSolicitud y Prioridad.
        El sistema funciona aunque este endpoint no esté disponible (RF-11).
        Roles permitidos: RESPONSABLE, ADMIN. RF-10.
      operationId: sugerirClasificacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugerirRequest'
      responses:
        '200':
          description: Sugerencia generada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SugerenciaDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/ia/resumen/{id}:
    post:
      tags: [Inteligencia Artificial]
      summary: Generar resumen de una solicitud
      description: >
        Solicita al modelo de IA un resumen ejecutivo de la solicitud indicada.
        El sistema funciona aunque este endpoint no esté disponible (RF-11).
        Roles permitidos: RESPONSABLE, ADMIN. RF-09.
      operationId: generarResumen
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
      responses:
        '200':
          description: Resumen generado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

# ─────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────
components:

  # ═══════════════════════════════════════════
  # PARÁMETROS REUTILIZABLES
  # ═══════════════════════════════════════════
  parameters:
    SolicitudId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ID único de la solicitud

  # ═══════════════════════════════════════════
  # RESPUESTAS REUTILIZABLES
  # ═══════════════════════════════════════════
  responses:
    BadRequest:
      description: Datos de entrada inválidos o campos faltantes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Token JWT ausente, inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: El rol del usuario no tiene permiso para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: >
        La operación entra en conflicto con el estado actual del recurso.
        Ejemplo: transición de estado inválida según la máquina de estados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Error interno del servidor no controlado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: >
        Servicio externo de IA no disponible temporalmente.
        La aplicación principal sigue funcionando. RF-11.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  # ENUMERACIONES
  # ═══════════════════════════════════════════
  schemas:

    EstadoSolicitud:
      type: string
      enum:
        - REGISTRADA
        - CLASIFICADA
        - EN_ATENCION
        - ATENDIDA
        - CERRADA
      description: >
        Ciclo de vida de la solicitud.
        CERRADA es estado final e inmutable.

    TipoSolicitud:
      type: string
      enum:
        - REGISTRO_ASIGNATURAS
        - HOMOLOGACION
        - CANCELACION_ASIGNATURA
        - SOLICITUD_CUPOS
        - CONSULTA_ACADEMICA
        - OTRO

    Prioridad:
      type: string
      enum:
        - BAJA
        - MEDIA
        - ALTA
        - CRITICA

    CanalOrigen:
      type: string
      enum:
        - CSU
        - CORREO
        - SAC
        - TELEFONICO
        - PRESENCIAL

    RolUsuario:
      type: string
      enum:
        - ESTUDIANTE
        - RESPONSABLE
        - ADMIN

    # ═══════════════════════════════════════════
    # REQUESTS
    # ═══════════════════════════════════════════
    LoginRequest:
      type: object
      required:
        - correo
        - password
      properties:
        correo:
          type: string
          format: email
          example: "estudiante@uqvirtual.edu.co"
        password:
          type: string
          minLength: 8
          pattern: "^(?=.*\\d)(?=.*[a-z])(?=.*[A-Z]).*$"
          example: "$CkjadkHkjh56"

    SolicitudRequest:
      type: object
      required:
        - descripcion
        - tipoSolicitud
        - canalOrigen
        - solicitanteId
      properties:
        descripcion:
          type: string
          minLength: 10
          maxLength: 2000
          example: "Solicito registro en la asignatura Programación Avanzada grupo 02."
        tipoSolicitud:
          $ref: '#/components/schemas/TipoSolicitud'
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        solicitanteId:
          type: integer
          format: int64
          example: 101

    ClasificarRequest:
      type: object
      required:
        - tipoSolicitud
        - prioridad
        - justificacionPrioridad
      properties:
        tipoSolicitud:
          $ref: '#/components/schemas/TipoSolicitud'
        prioridad:
          $ref: '#/components/schemas/Prioridad'
        justificacionPrioridad:
          type: string
          minLength: 10
          maxLength: 255
          example: "Solicitud urgente — periodo de matrículas vence en 48 horas."

    AsignarRequest:
      type: object
      required:
        - responsableId
      properties:
        responsableId:
          type: integer
          format: int64
          example: 25
          description: ID de un usuario con rol RESPONSABLE y activo = true

    CambiarEstadoRequest:
      type: object
      required:
        - nuevoEstado
        - observaciones
      properties:
        nuevoEstado:
          $ref: '#/components/schemas/EstadoSolicitud'
        observaciones:
          type: string
          minLength: 5
          maxLength: 500
          example: "Se inicia atención de la solicitud."

    CerrarRequest:
      type: object
      required:
        - observacionCierre
      properties:
        observacionCierre:
          type: string
          minLength: 10
          maxLength: 1000
          example: "Solicitud atendida satisfactoriamente. Se realizó el registro en el sistema académico."

    UsuarioRequest:
      type: object
      required:
        - nombre
        - apellido
        - correo
        - identificacion
        - rol
      properties:
        nombre:
          type: string
          maxLength: 100
          example: "Juan"
        apellido:
          type: string
          maxLength: 100
          example: "Pérez"
        correo:
          type: string
          format: email
          example: "jperez@uniquindio.edu.co"
        identificacion:
          type: string
          maxLength: 20
          example: "1094000123"
        rol:
          $ref: '#/components/schemas/RolUsuario'

    EstadoUsuarioRequest:
      type: object
      required:
        - activo
      properties:
        activo:
          type: boolean
          example: false
          description: true = activo, false = inactivo

    SugerirRequest:
      type: object
      required:
        - descripcion
      properties:
        descripcion:
          type: string
          minLength: 10
          maxLength: 2000
          example: "Necesito cancelar la asignatura Cálculo 2 por motivos médicos."

    # ═══════════════════════════════════════════
    # RESPONSES / DTOs
    # ═══════════════════════════════════════════
    LoginResponse:
      type: object
      required:
        - token
        - rol
        - nombre
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          description: Token JWT — incluir en cada petición como Bearer <token>
        rol:
          $ref: '#/components/schemas/RolUsuario'
        nombre:
          type: string
          example: "Juan Pérez"

    MensajeResponse:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: "Sesión cerrada exitosamente."

    SolicitudDTO:
      type: object
      required:
        - id
        - descripcion
        - estado
        - tipoSolicitud
        - prioridad
        - canalOrigen
        - fechaRegistro
        - nombreSolicitante
      properties:
        id:
          type: integer
          format: int64
          example: 42
        descripcion:
          type: string
          example: "Solicito registro en la asignatura Programación Avanzada."
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        tipoSolicitud:
          $ref: '#/components/schemas/TipoSolicitud'
        prioridad:
          $ref: '#/components/schemas/Prioridad'
        canalOrigen:
          $ref: '#/components/schemas/CanalOrigen'
        justificacionPrioridad:
          type: string
          example: "Periodo de matrículas activo."
        observacionCierre:
          type: string
          nullable: true
          example: null
        fechaRegistro:
          type: string
          format: date-time
          example: "2025-03-04T10:30:00"
        fechaCierre:
          type: string
          format: date-time
          nullable: true
          example: null
        nombreSolicitante:
          type: string
          example: "Juan Pérez"
        nombreResponsable:
          type: string
          nullable: true
          example: null
          description: Null hasta que se ejecute asignarResponsable()

    PageSolicitudDTO:
      type: object
      required:
        - content
        - totalElements
        - totalPages
        - currentPage
        - pageSize
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudDTO'
        totalElements:
          type: integer
          example: 1400
        totalPages:
          type: integer
          example: 70
        currentPage:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20

    HistorialDTO:
      type: object
      required:
        - id
        - accionRealizada
        - observaciones
        - fechaAccion
        - nombreUsuario
      properties:
        id:
          type: integer
          format: int64
          example: 15
        accionRealizada:
          type: string
          example: "Cambio de estado: REGISTRADA → CLASIFICADA"
        observaciones:
          type: string
          example: "Clasificada como SOLICITUD_CUPOS con prioridad ALTA."
        fechaAccion:
          type: string
          format: date-time
          example: "2025-03-04T11:00:00"
        nombreUsuario:
          type: string
          example: "María González"
          description: Nombre del usuario que ejecutó la acción

    UsuarioDTO:
      type: object
      required:
        - id
        - nombre
        - apellido
        - correo
        - identificacion
        - rol
        - activo
      properties:
        id:
          type: integer
          format: int64
          example: 25
        nombre:
          type: string
          example: "María"
        apellido:
          type: string
          example: "González"
        correo:
          type: string
          format: email
          example: "mgonzalez@uniquindio.edu.co"
        identificacion:
          type: string
          example: "1094000456"
        rol:
          $ref: '#/components/schemas/RolUsuario'
        activo:
          type: boolean
          example: true

    SugerenciaDTO:
      type: object
      required:
        - tipoSugerido
        - prioridadSugerida
      properties:
        tipoSugerido:
          $ref: '#/components/schemas/TipoSolicitud'
        prioridadSugerida:
          $ref: '#/components/schemas/Prioridad'
        confirmada:
          type: boolean
          default: false
          description: true si el RESPONSABLE aceptó la sugerencia

    ResumenDTO:
      type: object
      required:
        - resumen
      properties:
        resumen:
          type: string
          example: "El estudiante solicita cancelación de asignatura por motivos de salud debidamente documentados. Prioridad sugerida: ALTA."

    ErrorResponse:
      type: object
      required:
        - error
        - mensaje
      properties:
        error:
          type: string
          example: "CONFLICT"
          description: Código de error legible por el sistema
        mensaje:
          type: string
          example: "La solicitud ya se encuentra en estado CERRADA y no puede modificarse."
          description: Mensaje descriptivo para el usuario o el frontend

  # ═══════════════════════════════════════════
  # SEGURIDAD
  # ═══════════════════════════════════════════
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT obtenido en POST /api/auth/login.
        Incluir en cada petición como: Authorization: Bearer <token>.
        El token contiene el id del usuario y su rol, y tiene tiempo de expiración.
